<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个简单的待办事项应用" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/todo-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/todo-icon.svg" />
    <title>我的待办</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-app" aria-labelledby="page-title">
        <header>
          <p class="eyebrow">TODAY'S FOCUS</p>
          <h1 id="page-title">我的待办</h1>
          <p class="subtitle">记下现在要做的事，逐一完成。</p>
        </header>

        <form id="todo-form" class="todo-form" novalidate>
          <div class="todo-fields">
            <label class="task-field" for="todo-input">
              <span>新任务</span>
              <input id="todo-input" name="todo" type="text" placeholder="输入一项任务…" autocomplete="off" />
            </label>
            <label class="priority-field" for="priority-input">
              <span>优先级</span>
              <select id="priority-input" name="priority">
                <option value="low">低</option>
                <option value="normal" selected>普通</option>
                <option value="high">高</option>
              </select>
            </label>
            <label class="due-field" for="due-input">
              <span>截止时间（可选）</span>
              <input id="due-input" name="dueAt" type="datetime-local" />
            </label>
          </div>
          <button type="submit">添加任务</button>
        </form>
        <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>

        <section class="todo-section" aria-labelledby="todo-list-title">
          <div class="todo-section-header">
            <div>
              <h2 id="todo-list-title">任务列表</h2>
              <p id="remaining-count" class="remaining-count" aria-live="polite"></p>
            </div>
            <button id="clear-completed" class="clear-completed" type="button">清除已完成</button>
          </div>
          <div class="todo-filters" role="group" aria-label="筛选任务">
            <button class="filter-button filter-button--active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
          </div>
          <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
          <p id="empty-state" class="empty-state">还没有任务。先添加一项吧。</p>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
